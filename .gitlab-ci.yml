# vim: set expandtab shiftwidth=2 tabstop=8 textwidth=0 filetype=yaml:
#
# This CI uses the freedesktop.org ci-templates.
# Please see the ci-templates documentation for details:
# https://freedesktop.pages.freedesktop.org/ci-templates/

.templates_sha: &template_sha 185ede0e9b9b1924b92306ab8b882a6294e92613 # see https://docs.gitlab.com/ee/ci/yaml/#includefile


include:
  # Arch container builder template
  - project: 'freedesktop/ci-templates'
    ref: *template_sha
    file: '/templates/arch.yml'
  - project: 'freedesktop/ci-templates'
    ref: *template_sha
    file: '/templates/ci-fairy.yml'
  - template: Security/SAST.gitlab-ci.yml

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == 'merge_request_event'
    - if: $CI_PIPELINE_SOURCE == 'push'

stages:
  - prep             # prep work like rebuilding the container images if there is a change
  - build            # for actually building and testing things in a container
  - test
  - deploy


variables:
  FDO_UPSTREAM_REPO: 'xorg/lib/libxkbfile'
  # The tag should be updated each time the list of packages is updated.
  # Changing a tag forces the associated image to be rebuilt.
  # Note: the tag has no meaning, we use a date format purely for readability
  FDO_DISTRIBUTION_TAG: '2025-02-09.0'
  # minimal set of packages required to build and install either way
  BASE_PACKAGES: 'git gcc pkgconf xorgproto libx11'
  # packages needed to build and install with each set of tools
  AUTOTOOLS_PACKAGES: 'autoconf automake libtool make xorg-util-macros'
  MESON_PACKAGES: 'meson ninja'
  # extra packages we need for comparing autotools & meson builds
  EXTRA_PACKAGES: 'diffoscope diffutils findutils jq'
  FDO_DISTRIBUTION_PACKAGES: $BASE_PACKAGES $AUTOTOOLS_PACKAGES $MESON_PACKAGES $EXTRA_PACKAGES


#
# Verify that commit messages are as expected
#
check-commits:
  extends:
    - .fdo.ci-fairy
  stage: prep
  script:
    - ci-fairy check-commits --junit-xml=results.xml
  except:
    - master@xorg/lib/libxkbfile
  variables:
    GIT_DEPTH: 100
  artifacts:
    reports:
      junit: results.xml

#
# Verify that the merge request has the allow-collaboration checkbox ticked
#
check-merge-request:
  extends:
    - .fdo.ci-fairy
  stage: deploy
  script:
    - ci-fairy check-merge-request --require-allow-collaboration --junit-xml=results.xml
  artifacts:
    when: on_failure
    reports:
      junit: results.xml
  allow_failure: true


#
# Build a container with the given tag and the packages pre-installed.
# This only happens if/when the tag changes, otherwise the existing image is
# re-used.
#
container-prep:
  extends:
    - .fdo.container-build@arch
  stage: prep
  variables:
    GIT_STRATEGY: none

#
# Builds run on the image built above.
#

meson:
  extends:
    - .fdo.distribution-image@arch
  stage: build
  script:
    - mkdir -p ../_inst
    - meson setup builddir --prefix="$PWD/../_inst" -Dwarning_level=3
    - meson compile -C builddir
    - meson test -C builddir
    - meson install -C builddir

autotools:
  extends:
    - .fdo.distribution-image@arch
  stage: build
  script:
    - mkdir -p ../_inst _build
    - autoreconf -ivf
    - pushd _build
    - ../configure --prefix="$PWD/../_inst"
    - make check
    - make install
    - make distcheck
    - mv libxkbfile*.tar.gz ..
    - popd
  artifacts:
    paths:
      - libxkbfile*.tar.gz

meson from tarball:
  extends:
    - .fdo.distribution-image@arch
  stage: test
  script:
    - mkdir -p _tarball_build
    - tar xf libxkbfile-*.tar.gz -C _tarball_build
    - pushd _tarball_build/libxkbfile-*
    - meson setup builddir
    - meson compile -C builddir
    - meson test -C builddir
  needs:
    - autotools
  variables:
    GIT_STRATEGY: none

compare meson and autotools:
  extends:
    - .fdo.distribution-image@arch
  stage: test
  script:
    - mkdir -p $PWD/_meson_inst $PWD/_autotools_inst
    - CFLAGS="-O2 -fno-strict-aliasing"
      meson setup builddir --prefix=/usr --buildtype=plain
       -Ddefault_library=shared
    - meson compile -C builddir -v
    - DESTDIR=$PWD/_meson_inst meson install -C builddir
    - ./autogen.sh --prefix=/usr --enable-shared --disable-static
      CFLAGS="-O2 -D_FILE_OFFSET_BITS=64"
    - make V=1 && make install  DESTDIR=$PWD/_autotools_inst
    # get rid of expected differences between the two
    - rm -f $PWD/_autotools_inst/usr/lib/lib*.la
    - rm -f $PWD/_autotools_inst/usr/lib/libxkbfile.so
    - ln -s libxkbfile.so.1 $PWD/_autotools_inst/usr/lib/libxkbfile.so
    - find $PWD/_meson_inst $PWD/_autotools_inst
      -exec touch -h -r $PWD/_meson_inst/ {} \+
    - diffoscope --text-color=always _autotools_inst _meson_inst

check versions are in sync:
  extends:
    - .fdo.distribution-image@arch
  stage: test
  script:
    - autoreconf -ivf
    - ./configure --version | head -n 1 | sed -e 's/libxkbfile configure //' > autotools.version
    - meson introspect meson.build --projectinfo | jq -r '.version' > meson.version
    - diff -u autotools.version meson.version ||
      (echo "ERROR - autotools and meson versions not in sync" && false)
